[versions]
agp = "9.3.1"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
appcompat = "1.7.0"
material = "1.12.0"
fragmentKtx = "1.8.5"
navigation = "2.8.5"
constraintlayout = "2.2.0"
recyclerview = "1.3.2"
lifecycleViewmodelKtx = "2.11.0"
hilt = "2.60.1"
coroutinesPlayServices = "1.10.2"
mockk = "1.14.2"
kotlinxCoroutinesTest = "1.10.2"
androidxTestCore = "1.6.1"
fragmentTesting = "1.8.5"
